<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>Slime Volley</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #rotate {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      font: bold 24px/1.4 system-ui, sans-serif;
      text-align: center;
      z-index: 10;
    }
    @media (orientation: portrait) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="rotate">Telefonu yatay çevir 🔄</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
